CODE_160=The robot was powered off last time due to a joint position disagreement
CODE_160_suggestion=Try the following actions to see which resolves the issue: (A) Verify that the robot position in the 3D graphics matches the real robot to ensure the encoders function before releasing the brakes. Stand back and monitor the robot performing its first program cycle as expected, (B) If the position is not correct, the robot must be repaired. In this case, tap Power Off Robot, (C) If the position is correct, please tick the check box below the 3D graphics and click Robot Position Verified

